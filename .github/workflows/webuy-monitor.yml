name: webuy-monitor
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Solo mandar una notificación de prueba"
        type: boolean
        default: false
concurrency:
  group: webuy-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar estado
        uses: actions/cache@v4
        with:
          path: webuy-monitor/state.db
          key: webuy-state-${{ github.run_id }}
          restore-keys: webuy-state-
      - name: Revisar stock
        env:
          WEBUY_CONFIG: webuy-monitor/watch.json
          WEBUY_STATE: webuy-monitor/state.db
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then python3 webuy-monitor/monitor.py --test; exit 0; fi
          if [ "$(date -u +%H)" -ge 6 ] && [ "$(date -u +%H)" -lt 14 ]; then D=270; else D=0; fi
          python3 webuy-monitor/monitor.py $([ "$D" = 0 ] && echo --once || echo --duration $D)
